name: QA Tests

on:
  push:
    branches:
      - main
      - estefenis-challenge-QA
  pull_request:
    branches:
      - main
      - estefenis-challenge-QA

jobs:
  test:
    name: Run E2E and API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # ── BACKEND ──────────────────────────────────────────
      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Start backend
        working-directory: backend
        run: npm run start &

      # ── FRONTEND ─────────────────────────────────────────
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Start frontend
        working-directory: frontend
        run: npm run start &

      # ── AGUARDAR OS SERVIÇOS ─────────────────────────────
      - name: Wait for backend
        run: npx wait-on http://localhost:3000/todos/list --timeout 30000

      - name: Wait for frontend
        run: npx wait-on http://localhost:4200 --timeout 60000

      # ── QA TESTS ─────────────────────────────────────────
      - name: Install qa-tests dependencies
        working-directory: qa-tests
        run: npm install

      - name: Install Playwright browsers
        working-directory: qa-tests
        run: npx playwright install chromium --with-deps

      - name: Run all tests
        working-directory: qa-tests
        run: npm test

      # ── RELATÓRIO ────────────────────────────────────────
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: qa-tests/playwright-report/
          retention-days: 7